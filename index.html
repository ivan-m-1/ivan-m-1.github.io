<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Geometry Dash — 10 уровней</title>
  <style>
    /* ========== БАЗОВЫЕ СТИЛИ ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a12;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .screen.active {
      display: flex;
    }

    /* ========== МЕНЮ (ИСПРАВЛЕНО ДЛЯ ТЕЛЕФОНОВ) ========== */
    #menuScreen {
      background: radial-gradient(circle at 50% 30%, #1a1a3e 0%, #0a0a12 70%);
      gap: 15px;
      justify-content: flex-start; /* Чтобы не обрезало сверху */
      padding: 40px 10px; /* Отступы */
      overflow-y: auto; /* Разрешаем прокрутку на телефоне */
    }

    .logo {
      font-size: clamp(28px, 8vw, 72px);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #6ef3ff, #2a6cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(80, 180, 255, 0.4);
      margin-bottom: 4px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #8899bb;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      max-width: 900px;
      width: 100%;
      padding: 10px;
      flex-shrink: 0;
    }

    .level-card {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 2px solid #2a2a55;
      background: linear-gradient(145deg, #12122a, #1a1a3a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .level-card:active {
      transform: scale(0.95);
    }

    .level-card .num {
      font-size: clamp(20px, 5vw, 38px);
      font-weight: 900;
      color: #e8f0ff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .level-card .diff {
      font-size: clamp(8px, 2vw, 11px);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
      padding: 2px 6px;
      border-radius: 20px;
      background: rgba(0,0,0,0.35);
      white-space: nowrap;
    }

    .diff-easy   { color: #4cff8a; }
    .diff-normal { color: #ffd84c; }
    .diff-hard   { color: #ff7a4c; }
    .diff-harder { color: #ff4c7a; }
    .diff-insane { color: #c44cff; }

    .menu-footer {
      margin-top: auto;
      padding-bottom: 20px;
      font-size: 13px;
      color: #667799;
      text-align: center;
    }
    .menu-footer b { color: #aaccff; }

    /* ========== ИГРОВОЙ ЭКРАН ========== */
    #gameScreen {
      background: #0a0a12;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #0d0d1f;
      touch-action: none; /* Убирает скролл при нажатии */
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      z-index: 10;
      pointer-events: none;
    }

    #hud > * { pointer-events: auto; }

    .hud-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #ccddff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .hud-level {
      font-size: 16px;
      font-weight: 700;
      color: #e8f0ff;
    }

    .hud-attempts {
      font-size: 14px;
      color: #8899bb;
    }

    #progressBarContainer {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 600px;
      height: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
      z-index: 10;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      border-radius: 10px;
      background: linear-gradient(90deg, #2a6cff, #6ef3ff);
      transition: width 0.1s linear;
    }

    /* ========== ЭКРАНЫ СМЕРТИ / ПОБЕДЫ ========== */
    .overlay {
      background: rgba(5, 5, 15, 0.85);
      backdrop-filter: blur(6px);
      z-index: 50;
      justify-content: center;
    }

    .death-box, .win-box {
      background: linear-gradient(160deg, #16162e, #0e0e1f);
      border: 1px solid #2a2a55;
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 280px;
      margin: 0 20px;
    }

    .death-box h2 { color: #ff5c7a; font-size: 24px; }
    .win-box h2   { color: #4cff8a; font-size: 24px; }

    .death-box p, .win-box p {
      color: #99aacc;
      font-size: 15px;
    }

    .big-btn {
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, #3a7bff, #1f4fd0);
      color: #fff;
    }

    .big-btn.secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: #bbccdd;
    }

    /* ========== АДАПТИВ ДЛЯ ТЕЛЕФОНОВ ========== */
    @media (max-width: 700px) {
      .level-grid {
        grid-template-columns: repeat(3, 1fr); /* По 3 карточки в ряд */
        gap: 10px;
      }
      #hud { padding: 10px; }
      .hud-level { font-size: 14px; }
    }
  </style>
</head>
